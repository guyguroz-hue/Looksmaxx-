name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/git-project-connection-0gggzi]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Measurement-engine tests
        run: node test/metrics.mjs
      - name: Install Playwright
        run: npm i -D playwright@1.56.1 && npx playwright install --with-deps chromium
      - name: Browser smoke test
        run: node test/smoke.mjs

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # The app is plain static ES modules — there is nothing to build.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
